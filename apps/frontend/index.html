<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <!--
      `viewport-fit=cover` é o que faz `env(safe-area-inset-*)` valer alguma
      coisa no iOS. A plataforma já tinha regras de safe-area no globals.css
      (.pb-safe-area, o padding da barra inferior), mas sem isto o env()
      devolve 0 e o conteúdo passava por baixo do notch e do indicador de
      home.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Cor da barra do navegador; acompanha o tema claro/escuro. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f5f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

    <!-- Instalável na tela inicial, abrindo sem a barra do navegador. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALLKA" />
    <link rel="apple-touch-icon" href="/logo-allka-icon.png" />
    <meta name="description" content="Plataforma completa de gestão de projetos e tarefas" />
    <title>ALLKA - Plataforma de Gestão</title>
    <!-- Anti-flash: aplica a escala de fonte salva antes do primeiro render -->
    <script>
      (function () {
        var LEVELS = { min3: 0.75, min2: 0.8125, min1: 0.875, "default": 0.9375, plus1: 1.0, plus2: 1.0625, plus3: 1.125 };
        var stored = localStorage.getItem("allka_font_scale");
        var scale = LEVELS[stored] != null ? LEVELS[stored] : LEVELS["default"];
        var px = (Math.round(16 * scale * 100) / 100) + "px";
        document.documentElement.style.fontSize = px;
        document.documentElement.style.setProperty("--allka-font-scale", String(scale));
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&family=Montserrat:ital,wght@0,100..900;1,100..900&subset=latin,latin-ext&display=swap" rel="stylesheet" />
    <script
      src="https://maps.googleapis.com/maps/api/js?key=%VITE_GOOGLE_MAPS_API_KEY%&libraries=places,geometry&language=pt-BR"
      async
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
