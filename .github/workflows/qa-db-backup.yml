name: DB Backup (manual)

# Disparo manual only — nunca roda em push. Gera um dump completo do banco
# operacional direto no VPS (mysqldump dentro do próprio container mysql,
# nunca trafega a senha nem o dump pelos logs do Actions) e reporta só
# metadado não sensível (nome do arquivo, tamanho, checksum) no resumo do
# job. Nunca apaga backups anteriores — cada execução soma um novo arquivo
# carimbado com data/hora.
#
# Usa o MESMO grupo de concorrência dos deploys (`deploy-vps`) de propósito:
# nunca queremos um backup correndo ao mesmo tempo que um `docker compose up`
# no mesmo host.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_PORT:?Set the VPS_SSH_PORT secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote backup script
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/remote-backup.sh <<'SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          cd "$deploy_path"
          set -a
          source ./.env
          set +a
          mkdir -p backups
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          file="backups/allka-backup-${ts}.sql.gz"
          docker compose --env-file .env -f docker-compose.yml exec -T mysql \
            sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers "$MYSQL_DATABASE"' \
            | gzip > "$file"
          size_bytes="$(stat -c%s "$file")"
          checksum="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "backup_file=${file}"
          echo "backup_size_bytes=${size_bytes}"
          echo "backup_sha256=${checksum}"
          echo "backup_count=$(ls -1 backups/*.sql.gz | wc -l)"
          SCRIPT

      - name: Run mysqldump on the VPS and report metadata
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          # O script roda inteiro remotamente numa única sessão SSH — a senha
          # do MySQL é lida do .env já existente no VPS (nunca declarada de
          # novo aqui) e nunca sai do processo remoto: só o eco final
          # (arquivo, tamanho, sha256) volta pelo stdout do SSH.
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            .deploy/remote-backup.sh "$remote:/tmp/allka-remote-backup.sh"
          ssh "${SSH_OPTS[@]}" "$remote" "bash /tmp/allka-remote-backup.sh '${VPS_DEPLOY_PATH}' && rm -f /tmp/allka-remote-backup.sh"
