name: Prod Baseline Cleanup (manual)

# Leva o banco do SERVIDOR ao "modelo limpo" (16 contas: 12 do time + 4 fake,
# suas empresas/agências e 2 projetos fake; todo o resto dos dados operacionais
# sai). Catálogo catalog2 e configuração do sistema ficam intactos.
#
# Disparo manual only. Dois modos:
#   dry_run (padrão) — só conta o que há hoje e o que seria criado; NÃO escreve.
#   apply            — exige a frase de confirmação; gera e valida um backup
#                      completo ANTES; roda tudo numa transação única (qualquer
#                      erro desfaz tudo).
#
# O script (apps/backend/src/scripts/baseline-cleanup.ts) roda com a imagem de
# ferramentas pinada no commit que está no ar (mesmo padrão de qa-seed-demo.yml).
# Ele só existe nessa imagem depois de um deploy do backend que o inclua.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run só confere; apply APAGA dados do servidor"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]
      confirm:
        description: "Obrigatório só no apply: APAGAR DADOS DO SERVIDOR"
        required: false
        type: string

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate inputs and secrets
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_PORT:?Set the VPS_SSH_PORT secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"
          : "${GHCR_PAT:?Set the GHCR_PAT secret}"
          : "${GHCR_USERNAME:?Set the GHCR_USERNAME secret}"
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "APAGAR DADOS DO SERVIDOR" ]; then
            echo "::error::Para apply, informe exatamente: APAGAR DADOS DO SERVIDOR"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote script
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/remote-cleanup.sh <<'SCRIPT'
          set -euo pipefail
          deploy_path="$1"; mode="$2"; confirm="$3"; ghcr_user="$4"; ghcr_pat="$5"; repo="$6"
          cd "$deploy_path"
          set -a; source ./.env; set +a

          backup_ok="nao"
          if [ "$mode" = "apply" ]; then
            mkdir -p backups
            ts="$(date -u +%Y%m%dT%H%M%SZ)"
            file="backups/allka-pre-cleanup-${ts}.sql.gz"
            docker compose --env-file .env -f docker-compose.yml exec -T mysql \
              sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers "$MYSQL_DATABASE"' \
              | gzip > "$file"
            size="$(stat -c%s "$file")"
            gzip -t "$file"
            if [ "$size" -lt 1000000 ]; then
              echo "ERRO: backup suspeitamente pequeno (${size} bytes) — abortando antes de apagar." >&2
              exit 1
            fi
            echo "backup_file=${file}"
            echo "backup_size_bytes=${size}"
            echo "backup_sha256=$(sha256sum "$file" | cut -d' ' -f1)"
            backup_ok="sim"
          fi

          runtime_image="$(grep '^BACKEND_IMAGE=' .env | cut -d= -f2-)"
          [ -n "$runtime_image" ] || { echo "ERRO: BACKEND_IMAGE ausente no .env" >&2; exit 1; }
          tools_image="ghcr.io/${repo}/backend:tools-${runtime_image##*:}"
          printf '%s' "$ghcr_pat" | docker login ghcr.io -u "$ghcr_user" --password-stdin
          docker pull "$tools_image"
          echo "tools_image=${tools_image}"

          apply_flag=""
          [ "$mode" = "apply" ] && apply_flag="--apply"
          BACKEND_IMAGE="$tools_image" docker compose --env-file .env -f docker-compose.yml run --rm --no-deps \
            -e BASELINE_TARGET_ENV=production \
            -e BASELINE_EXPECTED_DB="$MYSQL_DATABASE" \
            -e BASELINE_CONFIRM="$confirm" \
            -e BASELINE_BACKUP_CONFIRMED="$backup_ok" \
            backend npx tsx src/scripts/baseline-cleanup.ts $apply_flag
          SCRIPT

      - name: Run on the VPS
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(-i "$HOME/.ssh/allka_deploy_key" -p "$VPS_SSH_PORT" -o ConnectTimeout=15 -o ConnectionAttempts=2 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          repo="${GITHUB_REPOSITORY,,}"
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            .deploy/remote-cleanup.sh "$remote:/tmp/allka-remote-cleanup.sh"
          ssh "${SSH_OPTS[@]}" "$remote" "bash /tmp/allka-remote-cleanup.sh '${VPS_DEPLOY_PATH}' '${MODE}' '${CONFIRM}' '${GHCR_USERNAME}' '${GHCR_PAT}' '${repo}'; rc=\$?; rm -f /tmp/allka-remote-cleanup.sh; exit \$rc"
