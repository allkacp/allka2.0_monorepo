name: VPS Docker Recover (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_phrase:
        description: "Digite exatamente RECUPERAR DOCKER VPS"
        required: true
        type: string

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Confirmar recuperação
        env:
          CONFIRM_PHRASE: ${{ inputs.confirm_phrase }}
        run: |
          test "$CONFIRM_PHRASE" = "RECUPERAR DOCKER VPS"

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts

      - name: Reiniciar Docker e confirmar recuperação
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(-i "$HOME/.ssh/allka_deploy_key" -p "$VPS_SSH_PORT" -o ConnectTimeout=15 -o ConnectionAttempts=2 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH_OPTS[@]}" "$remote" 'set -euo pipefail
            if sudo -n true 2>/dev/null; then
              sudo -n systemctl restart docker
            else
              systemctl restart docker
            fi
            for attempt in $(seq 1 30); do
              if docker ps >/dev/null 2>&1; then
                echo "Docker respondeu na tentativa ${attempt}/30."
                exit 0
              fi
              sleep 2
            done
            echo "Docker não respondeu após o reinício." >&2
            exit 1'
          curl --max-time 30 --retry 10 --retry-delay 2 --retry-connrefused -fsS https://api.allka.store/api/health >/dev/null
