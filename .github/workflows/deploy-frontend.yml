name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/frontend/**'
      - 'docker/frontend.prod.Dockerfile'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# O grupo de concorrência `deploy-vps` (mesmo nome usado por deploy-backend.yml,
# qa-db-backup.yml, etc.) é aplicado só no JOB `deploy` abaixo — NUNCA no
# nível do workflow inteiro. Motivo (revisão da PR #21, reunião 2026-09-14):
# concurrency no nível do workflow prende a RUN inteira ao grupo antes de
# qualquer step rodar, inclusive o job `wait-for-backend` (que só espera,
# nunca mexe no VPS). Se esse job de espera estivesse dentro do mesmo
# grupo, ele próprio ocuparia o slot enquanto espera o Deploy Backend —
# que por sua vez também precisa desse MESMO slot pra sequer começar —
# espera circular (os dois travados esperando um ao outro, pra sempre).
# Por isso só o job `deploy` (que de fato publica no VPS) entra no grupo,
# e só depois de `needs: wait-for-backend` já ter sido satisfeito.
#
# O propósito original do grupo continua o mesmo: os dois deploys nunca
# rodam simultaneamente contra o VPS (mesmo .env, mesmo `docker compose up
# -d`). Com grupos separados os dois rodavam em paralelo quando um push
# tocava backend e frontend — e nas duas vezes em que isso aconteceu
# (2882259 e e06c506) só o frontend subiu, sem erro visível. Push que
# tocava só o backend (a834786) subia normal. `cancel-in-progress: false`
# para enfileirar em vez de cancelar: cancelar o deploy do backend no meio
# deixaria o VPS num estado indefinido.

env:
  REGISTRY: ghcr.io
  FRONTEND_DOMAIN: allka.store
  API_DOMAIN: api.allka.store
  ROADMAP_QA_DOMAIN: ${{ secrets.ROADMAP_QA_DOMAIN || 'roadmap-qa.allka.store' }}
  VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.allka.store/api' }}
  VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
  MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE || 'allka' }}
  MYSQL_USER: ${{ secrets.MYSQL_USER || 'allka' }}

jobs:
  # Job separado, DE PROPÓSITO, sem `concurrency: group: deploy-vps` — só
  # consulta a API do GitHub (nunca toca o VPS), então nunca pode competir
  # pelo mesmo slot que o Deploy Backend precisa pra sequer começar a
  # rodar. Ver comentário grande acima de `env:` para o raciocínio completo
  # da espera circular que isto evita.
  wait-for-backend:
    runs-on: ubuntu-latest
    steps:
      # Revisão da PR #21 (reunião 2026-09-14) — achado real: os dois
      # deploys compartilhavam o MESMO grupo de concorrência só para NUNCA
      # rodar simultaneamente (mutação concorrente do mesmo .env/VPS,
      # incidente documentado nos commits 2882259/e06c506). Isso NUNCA
      # garantiu qual workflow começa primeiro quando o mesmo push aciona
      # os dois (toca apps/backend/** E apps/frontend/**, como esta
      # entrega) — sem esta checagem, o frontend novo podia publicar ANTES
      # do backend novo (e das migrations) terminarem, chamando rotas que
      # ainda não existem no ar. Só espera quando ESTE commit também toca
      # backend; deploys só-de-frontend seguem imediatos, sem espera.
      - name: Aguardar o Deploy Backend do MESMO commit, se este push também tocou o backend
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed_backend="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" --jq '.files[].filename' \
            | grep -E '^(apps/backend/|docker-compose\.prod\.yml$|docker/backend\.prod\.Dockerfile$|\.github/workflows/deploy-backend\.yml$)' | head -1 || true)"
          if [ -z "$changed_backend" ]; then
            echo "Este commit não toca o backend — Deploy Backend não deve disparar para ele; nada a esperar."
            exit 0
          fi
          echo "Este commit também toca o backend (ex.: '$changed_backend') — aguardando o Deploy Backend deste MESMO commit (${{ github.sha }}) terminar com sucesso antes de publicar o frontend."
          max_attempts=90
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            run_json="$(gh run list --repo "${{ github.repository }}" --workflow=deploy-backend.yml --json headSha,status,conclusion --limit 20 \
              | jq -c --arg sha "${{ github.sha }}" '[.[] | select(.headSha == $sha)] | first')"
            if [ "$run_json" != "null" ] && [ -n "$run_json" ]; then
              status="$(echo "$run_json" | jq -r '.status')"
              conclusion="$(echo "$run_json" | jq -r '.conclusion')"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Deploy Backend deste commit terminou com sucesso — seguindo com o frontend."
                  exit 0
                fi
                echo "::error::Deploy Backend deste commit terminou com conclusão '$conclusion' (não success/cancelled/o que for) — NÃO publicando o frontend contra um backend/migrations que falharam. Corrija o backend primeiro e dispare o frontend de novo (workflow_dispatch) depois."
                exit 1
              fi
              echo "Deploy Backend ainda em andamento (status=$status) — tentativa $attempt/$max_attempts, aguardando 20s."
            else
              echo "Run do Deploy Backend para este commit ainda não apareceu na lista — tentativa $attempt/$max_attempts, aguardando 20s."
            fi
            attempt=$((attempt + 1))
            sleep 20
          done
          echo "::error::Timeout esperando o Deploy Backend deste commit terminar (${max_attempts} tentativas, ~30min). Não publicando o frontend sem confirmar que o backend/migrations tiveram sucesso."
          exit 1

  deploy:
    needs: wait-for-backend
    runs-on: ubuntu-latest
    environment: dev
    # Só ESTE job (o que de fato publica no VPS) entra no grupo
    # `deploy-vps` — e só depois de `needs: wait-for-backend` já ter
    # terminado com sucesso. Ver comentário grande acima de `env:`.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          echo "frontend_image=${REGISTRY}/${repo}/frontend:${short_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${REGISTRY}/${repo}/frontend:dev" >> "$GITHUB_OUTPUT"
          # ${repo} ja vem em minusculas (GHCR exige); reaproveitar aqui evita
          # repetir a normalizacao na referencia do cache.
          echo "frontend_buildcache=${REGISTRY}/${repo}/frontend:buildcache" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY}/${repo}/backend:dev" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.prod.Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_USE_MOCKS=false
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            ${{ steps.images.outputs.frontend_latest }}
          # Cache de layers em registry, e não `type=gha`.
          #
          # O `type=gha` publicava imagens carimbadas com o SHA certo e código
          # de dias antes (ver aa89a0c). Ficou desligado desde então, ao custo
          # de alguns minutos por build. Volta agora por outro backend — o
          # próprio GHCR —, que é um caminho de armazenamento diferente do que
          # apresentou o problema.
          #
          # Como não há confirmação da causa original (exige os logs do
          # Actions), a rede de proteção é `npm run verificar:deploy`, que
          # confere o CONTEÚDO da imagem em produção e não só a tag. Se voltar
          # a sair código velho, desligar de novo é uma linha.
          cache-from: type=registry,ref=${{ steps.images.outputs.frontend_buildcache }}
          cache-to: type=registry,ref=${{ steps.images.outputs.frontend_buildcache }},mode=max


      - name: Validate required deploy secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_PAT: ${{ github.token }}
          ROADMAP_QA_BASIC_AUTH_USER: ${{ secrets.ROADMAP_QA_BASIC_AUTH_USER }}
          ROADMAP_QA_BASIC_AUTH_HASH: ${{ secrets.ROADMAP_QA_BASIC_AUTH_HASH }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_PORT:?Set the VPS_SSH_PORT secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"
          : "${GHCR_PAT:?Set the GHCR_PAT secret}"
          : "${ROADMAP_QA_BASIC_AUTH_USER:?Set the ROADMAP_QA_BASIC_AUTH_USER secret}"
          : "${ROADMAP_QA_BASIC_AUTH_HASH:?Set the ROADMAP_QA_BASIC_AUTH_HASH secret}"

      - name: Render deploy files
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ROADMAP_QA_BASIC_AUTH_USER: ${{ secrets.ROADMAP_QA_BASIC_AUTH_USER }}
          ROADMAP_QA_BASIC_AUTH_HASH: ${{ secrets.ROADMAP_QA_BASIC_AUTH_HASH }}
        run: |
          mkdir -p .deploy/infra/caddy
          cp docker-compose.prod.yml .deploy/docker-compose.yml
          cp infra/caddy/Caddyfile .deploy/infra/caddy/Caddyfile

          {
            printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
            printf 'FRONTEND_DOMAIN=%s\n' "$FRONTEND_DOMAIN"
            printf 'API_DOMAIN=%s\n' "$API_DOMAIN"
            printf 'MYSQL_DATABASE=%s\n' "$MYSQL_DATABASE"
            printf 'MYSQL_USER=%s\n' "$MYSQL_USER"
            printf 'MYSQL_PASSWORD=%s\n' "$MYSQL_PASSWORD"
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD"
            # Mesmos valores que deploy-backend.yml grava — mantidos aqui
            # também porque este workflow reescreve o .env inteiro (só
            # preserva BACKEND_IMAGE via sed depois, ver abaixo).
            printf 'ROADMAP_QA_DOMAIN=%s\n' "$ROADMAP_QA_DOMAIN"
            printf 'ROADMAP_QA_BASIC_AUTH_USER=%s\n' "$ROADMAP_QA_BASIC_AUTH_USER"
            # $$ escapes a literal "$" for Compose's own ${VAR} interpolation
            # — see the matching comment in deploy-backend.yml for why this
            # is required (bcrypt hashes contain literal "$" delimiters that
            # get mangled mid-value if left unescaped here).
            printf 'ROADMAP_QA_BASIC_AUTH_HASH=%s\n' "${ROADMAP_QA_BASIC_AUTH_HASH//\$/\$\$}"
          } > .deploy/.env

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload compose files
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          SCP_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -P "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          for i in 1 2 3; do
            if ssh "${SSH_OPTS[@]}" "$remote" "true"; then
              break
            fi
            echo "Tentativa SSH $i falhou. Aguardando 10s..."
            sleep 10
            if [ "$i" = "3" ]; then
              echo "::error::SSH inacessível em ${VPS_HOST}:${VPS_SSH_PORT}. Verifique VPS_HOST, VPS_SSH_PORT, firewall e se o serviço SSH está ativo no VPS."
              exit 1
            fi
          done
          ssh "${SSH_OPTS[@]}" "$remote" "mkdir -p '${VPS_DEPLOY_PATH}/infra/caddy'"

          # Preserva o pin do outro serviço.
          #
          # Este workflow fixa só a imagem do serviço que ele constrói; para o
          # outro ele escreve a tag móvel `dev`. Como o .env é copiado
          # inteiro, subir um serviço estava trocando a imagem do outro pela
          # `dev` — foi assim que um deploy de frontend rebaixou o backend
          # que tinha acabado de subir fixado no commit.
          #
          # Lê o valor que já está no VPS e o repõe depois da cópia. Na
          # primeira vez (sem .env remoto) não há o que preservar e vale a
          # `dev` mesmo.
          BACKEND_IMAGE_ATUAL="$(ssh "${SSH_OPTS[@]}" "$remote" "grep '^BACKEND_IMAGE=' '${VPS_DEPLOY_PATH}/.env' 2>/dev/null | cut -d= -f2-" || true)"

          scp "${SCP_OPTS[@]}" .deploy/docker-compose.yml "$remote:${VPS_DEPLOY_PATH}/docker-compose.yml"
          scp "${SCP_OPTS[@]}" .deploy/.env               "$remote:${VPS_DEPLOY_PATH}/.env"

          if [ -n "${BACKEND_IMAGE_ATUAL}" ]; then
            echo "Preservando BACKEND_IMAGE=${BACKEND_IMAGE_ATUAL}"
            ssh "${SSH_OPTS[@]}" "$remote" \
              "sed -i 's|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE_ATUAL}|' '${VPS_DEPLOY_PATH}/.env'"
          fi
          scp "${SCP_OPTS[@]}" .deploy/infra/caddy/Caddyfile "$remote:${VPS_DEPLOY_PATH}/infra/caddy/Caddyfile"

      - name: Deploy frontend on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_PAT: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          printf '%s' "$GHCR_PAT" | ssh "${SSH_OPTS[@]}" "$remote" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          # Idempotent — see the matching step in deploy-backend.yml for why
          # this can't just be `docker network create` unconditionally.
          ssh "${SSH_OPTS[@]}" "$remote" \
            "docker network inspect allka-proxy-shared >/dev/null 2>&1 || docker network create allka-proxy-shared"
          ssh "${SSH_OPTS[@]}" "$remote" \
            "cd '${VPS_DEPLOY_PATH}' && \
             docker compose --env-file .env -f docker-compose.yml pull frontend && \
             docker compose --env-file .env -f docker-compose.yml up -d --no-deps frontend && \
             docker compose --env-file .env -f docker-compose.yml up -d caddy && \
             docker image prune -f"
