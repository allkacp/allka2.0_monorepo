name: Prod Data Inspect (manual, read-only)

# Disparo manual, SOMENTE LEITURA. Mostra o que há hoje no banco do servidor
# (contagens principais) e confere quais das 16 contas do modelo limpo
# (12 do time + 4 fake) já existem lá. Serve de base para decidir a limpeza
# dos dados do servidor — nenhuma query aqui escreve, atualiza ou apaga.
# Roda dentro do container mysql (senha lida do .env do VPS, nunca impressa).

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_PORT:?Set the VPS_SSH_PORT secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote inspect script
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/remote-inspect.sh <<'SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          cd "$deploy_path"
          q() {
            docker compose --env-file .env -f docker-compose.yml exec -T mysql \
              sh -c 'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -N -B 2>/dev/null' <<< "$1"
          }
          echo "== contagens no servidor =="
          for t in users companies agencies nomades projects payments invoices catalog2_products clients system_alerts; do
            echo "$t=$(q "SELECT COUNT(*) FROM \`$t\`;" || echo n/d)"
          done
          echo "== contas do modelo limpo (16) =="
          for e in cp@lamego.com.vc rose@lamego.com.vc samanta@araujo.com valderio@lamego.com.vc reynario@lamego.com.vc joao@lamego.com gabriel@lamego.com.vc marcos@gabriel.com eron@lamego.com.vc gabriel.franco@lamego.com.vc contato@lamego.com.vc marcelodalbelles@yahoo.com.br company@allka.com.vc company2@allka.com.vc agency@allka.com.vc partner@allka.com.vc; do
            n="$(q "SELECT COUNT(*) FROM users WHERE email='$e';")"
            if [ "$n" = "1" ]; then echo "existe  $e"; else echo "FALTA   $e"; fi
          done
          echo "== migrations aplicadas (ultimas 3) =="
          q "SELECT migration_name FROM _prisma_migrations ORDER BY finished_at DESC LIMIT 3;"
          SCRIPT

      - name: Run inspection on the VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            .deploy/remote-inspect.sh "$remote:/tmp/allka-remote-inspect.sh"
          ssh "${SSH_OPTS[@]}" "$remote" "bash /tmp/allka-remote-inspect.sh '${VPS_DEPLOY_PATH}' && rm -f /tmp/allka-remote-inspect.sh"
