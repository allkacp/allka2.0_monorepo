name: Migration Baseline Reconcile (manual)

# Disparo manual, sempre em duas etapas separadas e nunca automáticas:
#
#   1. mode=diff  (padrão) — só CALCULA e imprime a diferença entre o schema
#      real do banco e prisma/schema.prisma. Não escreve nada no banco.
#      Rode isso primeiro e leia o resultado no resumo do job antes de
#      qualquer outra coisa.
#
#   2. mode=apply — só depois de ler o diff de (1) e confirmar que é
#      puramente aditivo (sem DROP/DELETE/TRUNCATE). Aplica exatamente esse
#      SQL contra o banco real, confirma que o diff pós-aplicação é vazio, e
#      só então marca `20260908000000_baseline_consolidated` como aplicada
#      (`migrate resolve --applied`) — nunca antes de provar equivalência.
#
# Este workflow existe porque o banco de produção real (único ambiente de
# deploy que existe hoje, ver auditoria do destino) já tem a árvore antiga de
# migrations aplicada, mas NENHUMA das tabelas novas deste sprint — não é
# nem "banco vazio" nem "banco já 100% equivalente", os dois únicos casos
# cobertos em docs/migrations-baseline-2026-09.md. `migrate deploy` sozinho
# tentaria recriar TODAS as tabelas (inclusive as que já existem) e falharia.
#
# mode=apply recusa se o diff calculado contiver DROP/DELETE/TRUNCATE — se
# isso acontecer, o procedimento correto é parar e investigar manualmente,
# nunca forçar por aqui.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diff (só relatório) ou apply (aplica o diff e resolve a baseline)"
        required: true
        default: "diff"
        type: choice
        options:
          - diff
          - apply
      confirm_phrase:
        description: "Só para mode=apply: digite exatamente RECONCILIAR BASELINE PRODUCAO"
        required: false
        default: ""

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs and secrets
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM_PHRASE: ${{ inputs.confirm_phrase }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_PORT:?Set the VPS_SSH_PORT secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"
          if [ "$MODE" = "apply" ] && [ "$CONFIRM_PHRASE" != "RECONCILIAR BASELINE PRODUCAO" ]; then
            echo "::error::mode=apply exige confirm_phrase exata: RECONCILIAR BASELINE PRODUCAO"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote diff script
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/remote-diff.sh <<'SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          cd "$deploy_path"
          set -a
          source ./.env
          set +a
          db_url="mysql://${MYSQL_USER:-allka}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-allka}"
          docker compose --env-file .env -f docker-compose.yml run --rm --no-deps \
            -e DATABASE_URL="$db_url" \
            backend npx prisma migrate diff \
              --from-url "$db_url" \
              --to-schema-datamodel prisma/schema.prisma \
              --script
          SCRIPT

      - name: Compute diff (schema real vs prisma/schema.prisma)
        id: diff
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            .deploy/remote-diff.sh "$remote:/tmp/allka-remote-diff.sh"
          ssh "${SSH_OPTS[@]}" "$remote" "bash /tmp/allka-remote-diff.sh '${VPS_DEPLOY_PATH}'; rm -f /tmp/allka-remote-diff.sh" > diff_output.sql
          echo "---- DIFF (schema real -> schema.prisma) ----"
          cat diff_output.sql
          {
            echo '## Diff de migration (produção -> schema.prisma)'
            echo '```sql'
            cat diff_output.sql
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qiE '^\s*(DROP |DELETE |TRUNCATE )' diff_output.sql; then
            echo "has_destructive=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q 'This is an empty migration' diff_output.sql; then
            echo "is_empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if diff is destructive
        if: steps.diff.outputs.has_destructive == 'true'
        run: |
          echo "::error::O diff contém DROP/DELETE/TRUNCATE. Parando — isso exige revisão manual, nunca aplicação automática."
          exit 1

      - name: Report-only (mode=diff)
        if: inputs.mode == 'diff'
        run: |
          echo "Modo diff — nada foi escrito no banco. Leia o resumo do job acima."
          echo "is_empty=${{ steps.diff.outputs.is_empty }}"

      - name: Render remote apply script
        if: inputs.mode == 'apply' && steps.diff.outputs.is_empty == 'false'
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/remote-apply.sh <<'SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          cd "$deploy_path"
          set -a
          source ./.env
          set +a

          echo "== Aplicando o diff (DDL aditivo) =="
          docker compose --env-file .env -f docker-compose.yml exec -T mysql \
            sh -c 'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' \
            < reconcile_diff.sql

          echo "== Garantindo as linhas estruturais do catalog2 (four_f + pricing_settings), sem duplicar =="
          docker compose --env-file .env -f docker-compose.yml exec -T mysql \
            sh -c 'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' \
            < reconcile_seed_rows.sql

          echo "== Confirmando diff vazio pós-aplicação =="
          db_url="mysql://${MYSQL_USER:-allka}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-allka}"
          docker compose --env-file .env -f docker-compose.yml run --rm --no-deps \
            -e DATABASE_URL="$db_url" \
            backend npx prisma migrate diff \
              --from-url "$db_url" \
              --to-schema-datamodel prisma/schema.prisma \
              --script > post_diff.sql
          cat post_diff.sql
          if ! grep -q 'This is an empty migration' post_diff.sql; then
            echo "ERRO: diff pós-aplicação não está vazio — NAO vou marcar a baseline como resolvida. Investigar manualmente." >&2
            exit 1
          fi

          echo "== Marcando a baseline consolidada como aplicada (equivalencia comprovada acima) =="
          docker compose --env-file .env -f docker-compose.yml run --rm --no-deps \
            -e DATABASE_URL="$db_url" \
            backend npx prisma migrate resolve --applied 20260908000000_baseline_consolidated

          echo "== migrate status =="
          docker compose --env-file .env -f docker-compose.yml run --rm --no-deps \
            -e DATABASE_URL="$db_url" \
            backend npx prisma migrate status
          SCRIPT

      - name: Apply diff and resolve baseline (mode=apply)
        if: inputs.mode == 'apply' && steps.diff.outputs.is_empty == 'false'
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            diff_output.sql "$remote:${VPS_DEPLOY_PATH}/reconcile_diff.sql"
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            .github/workflows/qa-catalog2-seed-rows.sql "$remote:${VPS_DEPLOY_PATH}/reconcile_seed_rows.sql"
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            .deploy/remote-apply.sh "$remote:/tmp/allka-remote-apply.sh"
          ssh "${SSH_OPTS[@]}" "$remote" "bash /tmp/allka-remote-apply.sh '${VPS_DEPLOY_PATH}' && rm -f /tmp/allka-remote-apply.sh"

      - name: Nothing to apply
        if: inputs.mode == 'apply' && steps.diff.outputs.is_empty == 'true'
        run: |
          echo "Diff ja esta vazio — schema real ja bate com schema.prisma. Rode a etapa de apply mesmo assim se quiser só marcar a baseline (sem SQL para executar)."
