name: Uploads Inspect + Backup (manual, read-only + backup)

# Item 15.1 (reuniao 2026-09-14, "Recuperacao e preservacao dos uploads") —
# apps/backend/src/lib/file-storage.ts grava uploads reais (documentos de
# projeto, base de conhecimento da IA, anexos diversos) em disco LOCAL do
# container backend (UPLOADS_ROOT = /app/apps/backend/uploads), e
# docker-compose.prod.yml nao tem nenhum volume pra esse caminho — risco
# real de perda a cada deploy, ja avisado no proprio codigo-fonte, nunca
# endereçado. Este workflow NUNCA para nem recria o backend (le/empacota
# arquivos do container EM EXECUCAO, via `docker compose exec`, sem
# reiniciar nada) e nunca escreve dentro do container — so lê de lá e
# grava um novo arquivo em backups/ no HOST do VPS (mesmo diretorio dos
# dumps de banco).
#
#   mode=inspect (so leitura) — lista quantidade/tamanho de arquivos por
#     subpasta (knowledge-base, project-documents, etc.) e confirma o
#     caminho absoluto real dentro do container. Nomes de arquivo
#     armazenados sao UUIDs gerados por generateStoredFileName() — nunca o
#     nome original enviado pelo usuario — entao listar nomes armazenados
#     nao vaza dado privado; mesmo assim só imprime contagem/tamanho por
#     subpasta, nunca a lista completa de nomes.
#   mode=backup — empacota TODO o diretorio de uploads do container num
#     .tar.gz em backups/ no host (nunca apaga um backup anterior), reporta
#     tamanho/sha256, e VALIDA extraindo numa pasta temporaria ISOLADA
#     (removida ao final, nunca sobrescreve nada) conferindo que a
#     contagem de arquivos extraidos bate com a do container.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect (só leitura, lista contagem/tamanho por subpasta) ou backup (empacota + verifica extração isolada)"
        required: true
        type: choice
        options:
          - inspect
          - backup

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_PORT:?Set the VPS_SSH_PORT secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote inspect script (só leitura, dentro do container em execução)
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/remote-uploads-inspect.sh <<'SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          cd "$deploy_path"

          root="/app/apps/backend/uploads"
          echo "caminho_absoluto_no_container=${root}"

          if ! docker compose --env-file .env -f docker-compose.yml exec -T backend sh -c "[ -d '${root}' ]"; then
            echo "diretorio_existe=false"
            echo "NOTA: diretorio de uploads ainda nao existe no container (ensureUploadDir so cria sob demanda, no primeiro upload de cada subpasta)."
            exit 0
          fi
          echo "diretorio_existe=true"

          echo "== contagem e tamanho total =="
          docker compose --env-file .env -f docker-compose.yml exec -T backend \
            sh -c "find '${root}' -type f | wc -l"
          docker compose --env-file .env -f docker-compose.yml exec -T backend \
            sh -c "du -sh '${root}' 2>/dev/null || echo 'n/a'"

          echo "== por subpasta (contagem + tamanho, nunca nomes de arquivo individuais) =="
          docker compose --env-file .env -f docker-compose.yml exec -T backend \
            sh -c "find '${root}' -mindepth 1 -maxdepth 1 -type d | sort | while read -r d; do \
              n=\$(find \"\$d\" -type f | wc -l); \
              s=\$(du -sh \"\$d\" 2>/dev/null | cut -f1); \
              echo \"  \$(basename \"\$d\"): \${n} arquivo(s), \${s}\"; \
            done"

          echo "== outros diretorios locais persistentes conhecidos (fora de uploads/) =="
          docker compose --env-file .env -f docker-compose.yml exec -T backend \
            sh -c "ls -la /app/apps/backend/ 2>/dev/null | grep -vE '^total|^d.*\s\.\.?$'" || true
          SCRIPT

      - name: Inspeciona (só leitura, backend em execução, sem reiniciar nada)
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(-i "$HOME/.ssh/allka_deploy_key" -p "$VPS_SSH_PORT" -o ConnectTimeout=15 -o ConnectionAttempts=2 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            .deploy/remote-uploads-inspect.sh "$remote:/tmp/allka-remote-uploads-inspect.sh"
          output="$(ssh "${SSH_OPTS[@]}" "$remote" "bash /tmp/allka-remote-uploads-inspect.sh '${VPS_DEPLOY_PATH}'; rc=\$?; rm -f /tmp/allka-remote-uploads-inspect.sh; exit \$rc")"
          echo "$output"
          {
            echo "## Inspeção de uploads (só leitura)"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backup:
    if: inputs.mode == 'backup'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_PORT:?Set the VPS_SSH_PORT secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote backup script (empacota do container em execução, sem parar/recriar nada; valida em pasta isolada)
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/remote-uploads-backup.sh <<'SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          cd "$deploy_path"

          root="/app/apps/backend/uploads"
          if ! docker compose --env-file .env -f docker-compose.yml exec -T backend sh -c "[ -d '${root}' ]"; then
            echo "IMPEDIMENTO: '${root}' não existe no container — nada para fazer backup ainda (nenhum upload aconteceu até agora)." >&2
            exit 1
          fi

          mkdir -p backups
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          file="backups/allka-uploads-backup-${ts}.tar.gz"

          # Lê do container EM EXECUÇÃO via stdout do exec — nunca para, nunca
          # recria, nunca escreve nada dentro do container. `tar` sobre um
          # diretório sendo escrito concorrentemente pode pegar um arquivo
          # "no meio" de um upload raríssimo em andamento — aceitável para
          # este snapshot; a sincronização final antes da publicação real
          # precisa rodar de novo, bem perto do corte (ver Item 15.1).
          docker compose --env-file .env -f docker-compose.yml exec -T backend \
            tar czf - -C /app/apps/backend uploads > "$file"

          size_bytes="$(stat -c%s "$file")"
          checksum="$(sha256sum "$file" | cut -d' ' -f1)"
          echo "backup_file=${file}"
          echo "backup_size_bytes=${size_bytes}"
          echo "backup_sha256=${checksum}"

          # Contagem de arquivos DENTRO do container, pra comparar com a
          # extração isolada abaixo.
          count_container="$(docker compose --env-file .env -f docker-compose.yml exec -T backend \
            sh -c "find '${root}' -type f | wc -l")"
          echo "arquivos_no_container=${count_container}"

          # Validação: extrai em pasta ISOLADA (nunca sobre uploads real),
          # confere contagem, remove a pasta de teste ao final (sucesso ou
          # falha) — nunca deixa lixo, nunca sobrescreve nada existente.
          extract_dir="$(mktemp -d)"
          cleanup() { rm -rf "$extract_dir"; }
          trap cleanup EXIT
          tar xzf "$file" -C "$extract_dir"
          count_extracted="$(find "$extract_dir/uploads" -type f | wc -l)"
          echo "arquivos_extraidos_pasta_isolada=${count_extracted}"
          if [ "$count_container" != "$count_extracted" ]; then
            echo "ERRO: contagem de arquivos no backup (${count_extracted}) não bate com o container (${count_container}) — backup pode estar incompleto." >&2
            exit 1
          fi
          echo "validacao_extracao=ok"
          SCRIPT

      - name: Gera backup dos uploads, verifica extração isolada
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(-i "$HOME/.ssh/allka_deploy_key" -p "$VPS_SSH_PORT" -o ConnectTimeout=15 -o ConnectionAttempts=2 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            .deploy/remote-uploads-backup.sh "$remote:/tmp/allka-remote-uploads-backup.sh"
          output="$(ssh "${SSH_OPTS[@]}" "$remote" "bash /tmp/allka-remote-uploads-backup.sh '${VPS_DEPLOY_PATH}'; rc=\$?; rm -f /tmp/allka-remote-uploads-backup.sh; exit \$rc")"
          echo "$output"
          {
            echo "## Backup de uploads (empacotado + extração isolada verificada)"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
