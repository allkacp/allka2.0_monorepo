name: Seed QA Demo (manual)

# Disparo manual only. Roda `npm run seed:qa-demo` dentro do container
# backend já em produção (mesmo binário/imagem que está no ar), com
# SEED_QA_ENVIRONMENT=qa explícito — o script recusa sozinho se essa
# variável não vier setada, e nunca imprime a senha no console (comprovado
# pelos testes em seed-qa-demo.integration.test.ts). Aceita --remove para
# desfazer a fixture (nunca toca nos 162 produtos operacionais nem nos 36
# rascunhos, por construção do próprio script).
#
# SEED_QA_PASSWORD precisa ser criado como secret do repositório por quem
# está operando o QA (nunca pelo Claude/CI) — assim a senha nunca passa por
# nenhum log, nenhuma mensagem, nenhum arquivo deste repositório.
#
# Roda com a imagem de ferramentas (estágio "build" do Dockerfile, publicada
# por deploy-backend.yml), não a imagem de runtime que está de fato no ar:
# a imagem de runtime roda `npm ci --omit=dev` (sem tsx, que é devDependency)
# e o Dockerfile não copia `src/` pro runtime (só `dist/`, e
# `src/scripts/**` é explicitamente excluído do build TypeScript em
# tsconfig.json) — então `tsx src/scripts/seed-qa-demo.ts` não existe nem
# roda na imagem de produção. A imagem de ferramentas tem devDependencies +
# src/ completos e roda dentro da mesma rede/serviço via `BACKEND_IMAGE`
# sobrescrito só para este `docker compose run`.
#
# Pinada pelo commit, nunca pela tag móvel `backend:tools`: lê o
# BACKEND_IMAGE que está de fato gravado no .env do VPS (a imagem de runtime
# realmente publicada), extrai o SHA de lá, e usa `backend:tools-<mesmo
# SHA>` — garante que o seed roda com código da MESMA versão que está no ar,
# nunca "o que main tiver agora" (que pode estar à frente do que foi
# deployado de verdade). O digest resolvido é impresso no resumo do job como
# prova.

on:
  workflow_dispatch:
    inputs:
      remove:
        description: "Marque true para rodar --remove (desfaz a fixture de QA)"
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SEED_QA_PASSWORD: ${{ secrets.SEED_QA_PASSWORD }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_PORT:?Set the VPS_SSH_PORT secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"
          : "${SEED_QA_PASSWORD:?Set the SEED_QA_PASSWORD secret (escolhida por quem opera o QA, nunca pelo CI)}"
          : "${GHCR_PAT:?Set the GHCR_PAT secret}"
          : "${GHCR_USERNAME:?Set the GHCR_USERNAME secret}"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render remote seed script
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/remote-seed.sh <<'SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          pwd_value="$2"
          extra_arg="$3"
          ghcr_user="$4"
          ghcr_pat="$5"
          repo="$6"
          cd "$deploy_path"

          runtime_image="$(grep '^BACKEND_IMAGE=' .env | cut -d= -f2-)"
          if [ -z "$runtime_image" ]; then
            echo "ERRO: nao encontrei BACKEND_IMAGE em ${deploy_path}/.env -- nao ha deploy de backend registrado para descobrir o commit." >&2
            exit 1
          fi
          commit_sha="${runtime_image##*:}"
          tools_image="ghcr.io/${repo}/backend:tools-${commit_sha}"

          printf '%s' "$ghcr_pat" | docker login ghcr.io -u "$ghcr_user" --password-stdin
          if ! docker pull "$tools_image"; then
            echo "ERRO: ${tools_image} nao existe no registry. O backend rodando em producao (${runtime_image}) foi deployado antes desta imagem de ferramentas pinada por commit existir, ou o deploy daquele commit nao chegou a publicar a imagem de ferramentas. Rode 'Deploy Backend' de novo (ou workflow_dispatch) pra publicar ${tools_image} antes de repetir o seed." >&2
            exit 1
          fi
          digest="$(docker inspect "$tools_image" --format '{{index .RepoDigests 0}}' 2>/dev/null || echo '(sem digest -- imagem só local)')"
          echo "tools_image=${tools_image}"
          echo "tools_image_digest=${digest}"
          echo "runtime_image_no_ar=${runtime_image}"

          BACKEND_IMAGE="$tools_image" docker compose --env-file .env -f docker-compose.yml run --rm --no-deps \
            -e SEED_QA_ENVIRONMENT=qa \
            -e SEED_QA_PASSWORD="$pwd_value" \
            backend npm run seed:qa-demo -- $extra_arg
          SCRIPT

      - name: Run seed:qa-demo on the VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
          SEED_QA_PASSWORD: ${{ secrets.SEED_QA_PASSWORD }}
          REMOVE_FLAG: ${{ inputs.remove }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          extra_arg=""
          if [ "$REMOVE_FLAG" = "true" ]; then
            extra_arg="--remove"
          fi
          repo="${GITHUB_REPOSITORY,,}"
          scp -i "$HOME/.ssh/allka_deploy_key" -P "$VPS_SSH_PORT" \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            .deploy/remote-seed.sh "$remote:/tmp/allka-remote-seed.sh"
          output="$(ssh "${SSH_OPTS[@]}" "$remote" "bash /tmp/allka-remote-seed.sh '${VPS_DEPLOY_PATH}' '${SEED_QA_PASSWORD}' '${extra_arg}' '${GHCR_USERNAME}' '${GHCR_PAT}' '${repo}'; rc=\$?; rm -f /tmp/allka-remote-seed.sh; exit \$rc")"
          echo "$output"
          {
            echo "## Seed QA — imagem usada (prova de commit)"
            echo '```'
            echo "$output" | grep -E "^(tools_image|tools_image_digest|runtime_image_no_ar)="
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
