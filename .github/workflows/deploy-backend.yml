name: Deploy Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/backend/**'
      - 'docker/backend.prod.Dockerfile'
      - 'docker-compose.prod.yml'
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Os dois deploys compartilham o MESMO grupo de concorrência de propósito.
#
# Eles terminam no mesmo VPS, mexendo no mesmo .env e rodando o mesmo
# `docker compose up -d`. Com grupos separados os dois rodavam em paralelo
# quando um push tocava backend e frontend — e nas duas vezes em que isso
# aconteceu (2882259 e e06c506) só o frontend subiu, sem erro visível. Push
# que tocava só o backend (a834786) subia normal.
#
# `cancel-in-progress: false` para enfileirar em vez de cancelar: cancelar o
# deploy do backend no meio deixaria o VPS num estado indefinido.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FRONTEND_DOMAIN: allka.store
  API_DOMAIN: api.allka.store
  ROADMAP_QA_DOMAIN: ${{ secrets.ROADMAP_QA_DOMAIN || 'roadmap-qa.allka.store' }}
  VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.allka.store/api' }}
  VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/allka-2026' }}
  MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE || 'allka' }}
  MYSQL_USER: ${{ secrets.MYSQL_USER || 'allka' }}
  RUN_RESET_USERS_PASSWORD: ${{ vars.RUN_RESET_USERS_PASSWORD || 'false' }}
  # Etapa D (staged rollout): stays 'false' until the Roadmap QA stack is
  # confirmed healthy on its own — flipping this alone (a repo Variable,
  # not a secret, re-dispatch to take effect) is the ONLY change needed to
  # turn the integration on, no code change required.
  PRODUCT_FEEDBACK_ENABLED: ${{ vars.PRODUCT_FEEDBACK_ENABLED || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          echo "backend_image=${REGISTRY}/${repo}/backend:${short_sha}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${REGISTRY}/${repo}/backend:dev" >> "$GITHUB_OUTPUT"
          # ${repo} ja vem em minusculas (GHCR exige); reaproveitar aqui evita
          # repetir a normalizacao na referencia do cache.
          echo "backend_buildcache=${REGISTRY}/${repo}/backend:buildcache" >> "$GITHUB_OUTPUT"
          echo "backend_tools=${REGISTRY}/${repo}/backend:tools" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${repo}/frontend:dev" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.prod.Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}
            ${{ steps.images.outputs.backend_latest }}
          # Cache de layers em registry, e não `type=gha`.
          #
          # O `type=gha` publicava imagens carimbadas com o SHA certo e código
          # de dias antes (ver aa89a0c). Ficou desligado desde então, ao custo
          # de alguns minutos por build. Volta agora por outro backend — o
          # próprio GHCR —, que é um caminho de armazenamento diferente do que
          # apresentou o problema.
          #
          # Como não há confirmação da causa original (exige os logs do
          # Actions), a rede de proteção é `npm run verificar:deploy`, que
          # confere o CONTEÚDO da imagem em produção e não só a tag. Se voltar
          # a sair código velho, desligar de novo é uma linha.
          cache-from: type=registry,ref=${{ steps.images.outputs.backend_buildcache }}
          cache-to: type=registry,ref=${{ steps.images.outputs.backend_buildcache }},mode=max

      - name: Build and push backend tools image (stage "build" — tem devDependencies e src/, usado só para rodar scripts pontuais como seed:qa-demo)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.prod.Dockerfile
          target: build
          push: true
          tags: |
            ${{ steps.images.outputs.backend_tools }}
          # Mesmo cache do build normal — o Dockerfile é multi-stage e o
          # estágio "build" já é compilado de qualquer forma para gerar o
          # runtime; isto só adiciona a tag/push de uma imagem que já existia
          # como camada intermediária, sem rebuildar nada do zero.
          cache-from: type=registry,ref=${{ steps.images.outputs.backend_buildcache }}

      - name: Smoke test — imagem recém-buildada resolve o require chain (sem banco real, sem secret real)
        # Pega exatamente a classe de bug que chegou a produção sem isto: o
        # cliente Prisma do Legacy é gerado em src/legacy/generated/ (não é
        # .ts, tsc nunca copia pra dist/) — sem a linha de COPY certa no
        # Dockerfile, dist/legacy/legacy-prisma.js quebra com
        # "Cannot find module './generated'" assim que o processo starta.
        # `getLegacyPrisma()`/instanciação do PrismaClient são lazy (só na
        # primeira chamada) — só fazer `require()` do módulo já garante que
        # a árvore de módulos resolve. app.js importa ~45 rotas que passam
        # por config.ts (valida env com zod e dá `process.exit(1)` se
        # inválido) — por isso DATABASE_URL/JWT_SECRET aqui são valores
        # sintáticamente válidos, nunca usados para conectar de verdade
        # (nenhuma query roda; só o require chain é exercitado).
        run: |
          docker run --rm --entrypoint node \
            -e DATABASE_URL="mysql://smoketest:smoketest@localhost:3306/smoketest" \
            -e JWT_SECRET="smoke-test-fake-secret-not-real" \
            "${{ steps.images.outputs.backend_image }}" \
            -e "require('/app/apps/backend/dist/legacy/legacy-prisma.js'); require('/app/apps/backend/dist/app.js'); console.log('require chain OK')"

      - name: Validate required deploy secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ROADMAP_HMAC_KEY_ID: ${{ secrets.ROADMAP_HMAC_KEY_ID }}
          ROADMAP_HMAC_SECRET: ${{ secrets.ROADMAP_HMAC_SECRET }}
          ROADMAP_QA_BASIC_AUTH_USER: ${{ secrets.ROADMAP_QA_BASIC_AUTH_USER }}
          ROADMAP_QA_BASIC_AUTH_HASH: ${{ secrets.ROADMAP_QA_BASIC_AUTH_HASH }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_PORT:?Set the VPS_SSH_PORT secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"
          : "${GHCR_PAT:?Set the GHCR_PAT secret}"
          : "${MYSQL_PASSWORD:?Set the MYSQL_PASSWORD secret}"
          : "${MYSQL_ROOT_PASSWORD:?Set the MYSQL_ROOT_PASSWORD secret}"
          : "${JWT_SECRET:?Set the JWT_SECRET secret}"
          : "${ROADMAP_HMAC_KEY_ID:?Set the ROADMAP_HMAC_KEY_ID secret}"
          : "${ROADMAP_HMAC_SECRET:?Set the ROADMAP_HMAC_SECRET secret}"
          : "${ROADMAP_QA_BASIC_AUTH_USER:?Set the ROADMAP_QA_BASIC_AUTH_USER secret}"
          : "${ROADMAP_QA_BASIC_AUTH_HASH:?Set the ROADMAP_QA_BASIC_AUTH_HASH secret}"
          # ROADMAP_SSO_HMAC_KEY_ID/SECRET are deliberately NOT required here:
          # they're an opt-in purpose-separated secret for the SSO handoff
          # (see routes/roadmap-sso.ts). Unset -> the backend falls back to
          # the base ROADMAP_HMAC_* pair (today's behavior), so this
          # workflow keeps working before/after the new secret is set.

      - name: Render deploy files
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROADMAP_HMAC_KEY_ID: ${{ secrets.ROADMAP_HMAC_KEY_ID }}
          ROADMAP_HMAC_SECRET: ${{ secrets.ROADMAP_HMAC_SECRET }}
          ROADMAP_SSO_HMAC_KEY_ID: ${{ secrets.ROADMAP_SSO_HMAC_KEY_ID }}
          ROADMAP_SSO_HMAC_SECRET: ${{ secrets.ROADMAP_SSO_HMAC_SECRET }}
          ROADMAP_QA_BASIC_AUTH_USER: ${{ secrets.ROADMAP_QA_BASIC_AUTH_USER }}
          ROADMAP_QA_BASIC_AUTH_HASH: ${{ secrets.ROADMAP_QA_BASIC_AUTH_HASH }}
        run: |
          mkdir -p .deploy/infra/caddy
          cp docker-compose.prod.yml .deploy/docker-compose.yml
          cp infra/caddy/Caddyfile .deploy/infra/caddy/Caddyfile

          {
            printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
            printf 'FRONTEND_DOMAIN=%s\n' "$FRONTEND_DOMAIN"
            printf 'API_DOMAIN=%s\n' "$API_DOMAIN"
            printf 'MYSQL_DATABASE=%s\n' "$MYSQL_DATABASE"
            printf 'MYSQL_USER=%s\n' "$MYSQL_USER"
            printf 'MYSQL_PASSWORD=%s\n' "$MYSQL_PASSWORD"
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD"
            # Consumidas pelo serviço caddy (reverse proxy da Central QA) —
            # nunca pelo backend.
            printf 'ROADMAP_QA_DOMAIN=%s\n' "$ROADMAP_QA_DOMAIN"
            printf 'ROADMAP_QA_BASIC_AUTH_USER=%s\n' "$ROADMAP_QA_BASIC_AUTH_USER"
            # $$ escapes a literal "$" for Compose's own ${VAR} interpolation
            # in docker-compose.prod.yml's `caddy` service (this value is
            # consumed via `${ROADMAP_QA_BASIC_AUTH_HASH:-}`, not env_file).
            # bcrypt hashes always contain literal "$" delimiters; left
            # unescaped, Compose's interpolation mangles them mid-value —
            # empirically confirmed live: a 60-char hash arrived at the
            # container truncated to 38 chars with a "$" turned into ".".
            printf 'ROADMAP_QA_BASIC_AUTH_HASH=%s\n' "${ROADMAP_QA_BASIC_AUTH_HASH//\$/\$\$}"
          } > .deploy/.env

          {
            printf 'DATABASE_URL=mysql://%s:%s@mysql:3306/%s\n' "$MYSQL_USER" "$MYSQL_PASSWORD" "$MYSQL_DATABASE"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'PORT=3001\n'
            printf 'NODE_ENV=production\n'
            printf 'FRONTEND_URL=https://%s\n' "$FRONTEND_DOMAIN"
            printf 'CORS_ORIGIN=https://%s\n' "$FRONTEND_DOMAIN"
            # Chave do Gemini — sem ela os recursos de IA (melhorar campo,
            # pesquisa de mercado, geração de imagem) respondem erro em
            # produção. Vem do secret GEMINI_API_KEY do repositório.
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            # Integração com a Central de chamados (Roadmap QA). O booleano
            # abaixo é uma Variable do repositório (não segredo) — trocá-lo
            # e rodar este workflow de novo é o único passo para ligar/
            # desligar a integração (Etapa D), sem mexer em código nem em
            # nenhum dos segredos HMAC.
            printf 'PRODUCT_FEEDBACK_ENABLED=%s\n' "$PRODUCT_FEEDBACK_ENABLED"
            printf 'PRODUCT_FEEDBACK_ENVIRONMENT=qa\n'
            printf 'ROADMAP_API_URL=http://allka-roadmap-qa-backend:3002\n'
            printf 'ROADMAP_HMAC_KEY_ID=%s\n' "$ROADMAP_HMAC_KEY_ID"
            printf 'ROADMAP_HMAC_SECRET=%s\n' "$ROADMAP_HMAC_SECRET"
            # Purpose-separated from ROADMAP_HMAC_*: this pair only ever
            # signs POST .../allka/sso/tickets, never ticket creation.
            printf 'ROADMAP_SSO_HMAC_KEY_ID=%s\n' "$ROADMAP_SSO_HMAC_KEY_ID"
            printf 'ROADMAP_SSO_HMAC_SECRET=%s\n' "$ROADMAP_SSO_HMAC_SECRET"
            printf 'ROADMAP_REQUEST_TIMEOUT_MS=5000\n'
            printf 'ROADMAP_INTERNAL_URL=https://%s\n' "$ROADMAP_QA_DOMAIN"
          } > .deploy/.env.backend

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/allka_deploy_key
          chmod 600 ~/.ssh/allka_deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/allka_deploy_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload compose files
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          SCP_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -P "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          for i in 1 2 3; do
            if ssh "${SSH_OPTS[@]}" "$remote" "true"; then
              break
            fi
            echo "Tentativa SSH $i falhou. Aguardando 10s..."
            sleep 10
            if [ "$i" = "3" ]; then
              echo "::error::SSH inacessível em ${VPS_HOST}:${VPS_SSH_PORT}. Verifique VPS_HOST, VPS_SSH_PORT, firewall e se o serviço SSH está ativo no VPS."
              exit 1
            fi
          done
          ssh "${SSH_OPTS[@]}" "$remote" "mkdir -p '${VPS_DEPLOY_PATH}/infra/caddy'"

          # Preserva o pin do outro serviço.
          #
          # Este workflow fixa só a imagem do serviço que ele constrói; para o
          # outro ele escreve a tag móvel `dev`. Como o .env é copiado
          # inteiro, subir um serviço estava trocando a imagem do outro pela
          # `dev` — foi assim que um deploy de frontend rebaixou o backend
          # que tinha acabado de subir fixado no commit.
          #
          # Lê o valor que já está no VPS e o repõe depois da cópia. Na
          # primeira vez (sem .env remoto) não há o que preservar e vale a
          # `dev` mesmo.
          FRONTEND_IMAGE_ATUAL="$(ssh "${SSH_OPTS[@]}" "$remote" "grep '^FRONTEND_IMAGE=' '${VPS_DEPLOY_PATH}/.env' 2>/dev/null | cut -d= -f2-" || true)"

          scp "${SCP_OPTS[@]}" .deploy/docker-compose.yml "$remote:${VPS_DEPLOY_PATH}/docker-compose.yml"
          scp "${SCP_OPTS[@]}" .deploy/.env               "$remote:${VPS_DEPLOY_PATH}/.env"

          if [ -n "${FRONTEND_IMAGE_ATUAL}" ]; then
            echo "Preservando FRONTEND_IMAGE=${FRONTEND_IMAGE_ATUAL}"
            ssh "${SSH_OPTS[@]}" "$remote" \
              "sed -i 's|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_IMAGE_ATUAL}|' '${VPS_DEPLOY_PATH}/.env'"
          fi
          scp "${SCP_OPTS[@]}" .deploy/.env.backend        "$remote:${VPS_DEPLOY_PATH}/.env.backend"
          scp "${SCP_OPTS[@]}" .deploy/infra/caddy/Caddyfile "$remote:${VPS_DEPLOY_PATH}/infra/caddy/Caddyfile"

      - name: Deploy backend on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          printf '%s' "$GHCR_PAT" | ssh "${SSH_OPTS[@]}" "$remote" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          # Idempotent: the network may already exist (created by this same
          # step on a previous run, or by the Roadmap QA deploy running
          # first) — `inspect` short-circuits the `create` in that case, so
          # this never errors on a re-run either way.
          ssh "${SSH_OPTS[@]}" "$remote" \
            "docker network inspect allka-proxy-shared >/dev/null 2>&1 || docker network create allka-proxy-shared"

          mkdir -p .deploy
          cat > .deploy/remote-health-check.sh <<'SCRIPT'
          set -uo pipefail
          deploy_path="$1"
          cd "$deploy_path"
          max_attempts=30
          delay=2
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            if docker compose --env-file .env -f docker-compose.yml exec -T backend \
              node -e "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" \
              >/dev/null 2>&1; then
              echo "Backend respondeu 200 em /api/health na tentativa ${attempt}/${max_attempts}."
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep "$delay"
          done
          echo "##[error]Backend nao respondeu 200 em /api/health apos ${max_attempts} tentativas (~$((max_attempts * delay))s). Contêiner iniciado != aplicação saudável." >&2
          echo "===== docker compose ps --all =====" >&2
          docker compose --env-file .env -f docker-compose.yml ps --all >&2
          echo "===== ultimas 200 linhas de log do backend (sanitizado) =====" >&2
          docker compose --env-file .env -f docker-compose.yml logs --no-color --tail 200 backend 2>&1 | sed -E \
            -e 's#(mysql://[^:/@[:space:]]+):[^@[:space:]]+@#\1:***@#g' \
            -e 's#(JWT_SECRET|GEMINI_API_KEY|MYSQL_ROOT_PASSWORD|MYSQL_PASSWORD|ROADMAP_HMAC_SECRET|ROADMAP_SSO_HMAC_SECRET|SEED_QA_PASSWORD)=[^[:space:]]+#\1=***REDACTED***#g' >&2
          exit 1
          SCRIPT
          scp "${SCP_OPTS[@]}" .deploy/remote-health-check.sh "$remote:/tmp/allka-remote-health-check.sh"

          # O `&&` propaga falha do health check pra falha do workflow — se o
          # backend não ficar saudável, caddy NUNCA é atualizado (continua
          # servindo o backend anterior, se houver) e image prune não roda.
          # "Container Running" (docker compose up -d) nunca é o critério de
          # sucesso sozinho — só a resposta HTTP real conta.
          ssh "${SSH_OPTS[@]}" "$remote" \
            "cd '${VPS_DEPLOY_PATH}' && \
             docker compose --env-file .env -f docker-compose.yml pull backend && \
             docker compose --env-file .env -f docker-compose.yml up -d mysql && \
             docker compose --env-file .env -f docker-compose.yml run --rm migrate && \
             docker compose --env-file .env -f docker-compose.yml up -d --no-deps backend && \
             bash /tmp/allka-remote-health-check.sh '${VPS_DEPLOY_PATH}'; rc=\$?; rm -f /tmp/allka-remote-health-check.sh; exit \$rc"

          ssh "${SSH_OPTS[@]}" "$remote" \
            "cd '${VPS_DEPLOY_PATH}' && \
             docker compose --env-file .env -f docker-compose.yml up -d caddy && \
             (docker compose --env-file .env -f docker-compose.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile || echo '[warn] caddy reload failed — se o container acabou de subir pelo up -d acima, ele já carregou o Caddyfile atual no boot, então isso é inofensivo; se já estava rodando de antes, rode manualmente.') && \
             docker image prune -f"

      # ── Nenhum seed roda automaticamente no deploy ──────────────────────────────
      # O deploy normal faz só: build → migrate deploy → subir o backend →
      # limpeza de imagens antigas. Não existe seed de produção nem bootstrap
      # automático — decisão explícita (ver "SANEAMENTO FINAL DA FASE 1", seção 4):
      # não há hoje necessidade comprovada de dados obrigatórios pós-deploy que
      # não venham de migration. Catálogo de produtos/tarefas, quando precisar
      # ser (re)populado, é feito manualmente via os comandos já existentes
      # (db:seed:products, db:seed:catalog-tasks) — nenhum dos dois é
      # automático nem específico de produção.
      #
      # apps/backend/src/scripts/seed-realistic-demo.ts é um seed de
      # DEMONSTRAÇÃO — cria usuários/projetos/tarefas de teste com senha de
      # teste. Não é uma ferramenta de produção: bloqueia contra qualquer host
      # que não seja localhost/127.0.0.1, não é compilado pro build (fica em
      # src/scripts/, fora do tsconfig), não é citado neste workflow nem no
      # Dockerfile, e não pode ser invocado dentro do container de produção.
      #
      # Existe também um caminho alternativo via endpoints admin (Bearer token
      # de admin): POST /api/admin/seed/agency-real | empresa-real | lider-real
      # (src/routes/admin-seed.ts). ATENÇÃO: esses endpoints ainda não foram
      # migrados pra este mesmo padrão (ainda criam ProjectTask diretamente,
      # sem passar pelo serviço central de pagamento) — gap conhecido, fora do
      # escopo desta correção.
      # ────────────────────────────────────────────────────────────────────────────

      - name: Reset users password on VPS
        if: ${{ env.RUN_RESET_USERS_PASSWORD == 'true' }}
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          VPS_HOST="$(echo -n "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(echo -n "$VPS_USER" | tr -d '[:space:]')"
          VPS_SSH_PORT="$(echo -n "$VPS_SSH_PORT" | tr -d '[:space:]')"
          remote="${VPS_USER}@${VPS_HOST}"
          SSH_OPTS=(
            -i "$HOME/.ssh/allka_deploy_key"
            -p "$VPS_SSH_PORT"
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          ssh "${SSH_OPTS[@]}" "$remote" \
            "cd '${VPS_DEPLOY_PATH}' && docker compose --env-file .env -f docker-compose.yml run --rm --no-deps backend npm run reset:users-password"
