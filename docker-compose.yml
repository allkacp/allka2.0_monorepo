services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: allka
      MYSQL_USER: allka
      MYSQL_PASSWORD: allka_dev
      MYSQL_ROOT_PASSWORD: allka_root_dev
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uallka -pallka_dev --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    working_dir: /repo/apps/backend
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: mysql://allka:allka_dev@mysql:3306/allka
      # Consulta da Plataforma Anterior (sprint de produtos, bloco 1/6) — a
      # APLICAÇÃO usa credencial SOMENTE LEITURA no banco legado separado.
      # Só existe se o banco/usuário forem criados (ver docs/consulta-legado.md);
      # ausente/errada → as rotas /api/admin/legacy respondem 503.
      LEGACY_DATABASE_URL: mysql://allka_legacy_ro:legacy_ro_dev@mysql:3306/allka_legacy
      JWT_SECRET: local-development-secret
      # Cofre de segredos (APENAS desenvolvimento local; em produção a chave é outra e fica fora do repositório).
      META_TOKEN_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      SECURE_BROWSER_RUNNER_URL: http://browser-runner:7000
      SECURE_BROWSER_RUNNER_SECRET: dev-runner-secret-local
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend:/repo/apps/backend
      - ./apps/frontend/dev-mocks:/repo/apps/frontend/dev-mocks:ro
      - /repo/node_modules
      - /repo/apps/backend/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      browser-runner:
        condition: service_started

  # Navegador seguro (D3): Chromium real isolado. Sem porta publicada: só o backend o alcança.
  browser-runner:
    build:
      context: .
      dockerfile: docker/browser-runner/Dockerfile
    restart: unless-stopped
    environment:
      RUNNER_SECRET: dev-runner-secret-local
      MAX_SESSIONS: "5"
    mem_limit: 4g
    cpus: 4
    shm_size: 1gb
    ports:
      - "127.0.0.1:7000:7000"   # só loopback, para os testes locais; em produção não se publica

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    working_dir: /repo/apps/frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:3001/api
      VITE_USE_MOCKS: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./apps/frontend:/repo/apps/frontend
      - /repo/node_modules
      - /repo/apps/frontend/node_modules
    depends_on:
      - backend

volumes:
  mysql_dev_data: