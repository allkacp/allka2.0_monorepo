name: allka-2026

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-allka}
      MYSQL_USER: ${MYSQL_USER:-allka}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - allka_internal

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: "no"
    working_dir: /app/apps/backend
    # Item 16.2 (reunião 2026-09-14): não roda "prisma migrate deploy" puro.
    # migrate-deploy-checked.sh verifica primeiro se `_prisma_migrations`
    # está de fato reconciliado com o schema físico do banco (mesmo `prisma
    # migrate diff` do workflow de reconciliação) — só chama `migrate
    # deploy` quando isso é seguro. Se abortar (exit 1), este serviço falha
    # e `docker compose run --rm migrate && up -d --no-deps backend` nunca
    # chega a trocar o backend em execução.
    command: ["./migrate-deploy-checked.sh"]
    env_file:
      - ./.env.backend
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-allka}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-allka}
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - allka_internal

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    working_dir: /app/apps/backend
    env_file:
      - ./.env.backend
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-allka}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-allka}
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: https://${FRONTEND_DOMAIN:-allka.store}
      CORS_ORIGIN: https://${FRONTEND_DOMAIN:-allka.store}
    depends_on:
      mysql:
        condition: service_healthy
    # Item 15.1 (reuniao 2026-09-14) -- file-storage.ts grava uploads reais
    # (documentos de projeto, base de conhecimento da IA, anexos diversos)
    # em UPLOADS_ROOT = /app/apps/backend/uploads; sem volume aqui, todo
    # deploy (docker compose up -d --no-deps backend) apaga esse diretorio
    # (disco efemero do container). ATENCAO ao aplicar: um volume NOMEADO
    # NOVO monta VAZIO por cima do caminho -- se ja existir algo la dentro
    # do container atual quando esta mudanca for aplicada, popule o volume
    # ANTES de trocar o container (procedimento documentado em
    # docs/qa/reuniao-2026-09-14.md, Item 15.1 -- nunca aplicar direto sem
    # conferir com o workflow "Uploads Inspect + Backup", mode=inspect,
    # primeiro).
    volumes:
      - backend_uploads:/app/apps/backend/uploads
    expose:
      - "3001"
    networks:
      - allka_internal
      # Needs to reach allka-roadmap-qa-backend by name for the product-
      # feedback integration (POST/GET work-items). Never joins qa-internal
      # (the Roadmap's own MySQL network) — only this shared proxy network.
      - allka-proxy-shared

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - allka_internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-allka.store}
      API_DOMAIN: ${API_DOMAIN:-api.allka.store}
      ROADMAP_QA_DOMAIN: ${ROADMAP_QA_DOMAIN:-roadmap-qa.allka.store}
      ROADMAP_QA_BASIC_AUTH_USER: ${ROADMAP_QA_BASIC_AUTH_USER:-}
      ROADMAP_QA_BASIC_AUTH_HASH: ${ROADMAP_QA_BASIC_AUTH_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - allka_internal
      # So Caddy can reverse-proxy to allka-roadmap-qa-backend/-frontend by
      # their container aliases, exactly like it already does for this
      # stack's own backend/frontend over allka_internal.
      - allka-proxy-shared

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  backend_uploads:

networks:
  allka_internal:
    driver: bridge
  # Shared between this repo and allka-roadmap's QA deploy — created
  # idempotently by the deploy workflow before `docker compose up`
  # (`docker network inspect ... || docker network create ...`), never
  # managed by compose itself (external: true). The Roadmap's own MySQL
  # never joins this network; only its backend/frontend do, so Caddy and
  # this backend can resolve them by name without exposing any Roadmap
  # port on the host.
  allka-proxy-shared:
    external: true